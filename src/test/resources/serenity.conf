webdriver {
  driver = "chrome"
  autodownload = true
  timeouts {
    implicitlywait = 2000
  }
}

chrome {
  switches = """
    --headless=new;
    --disable-gpu;
    --window-size=1440,1000;
    --no-sandbox;
    --disable-dev-shm-usage;
    --remote-allow-origins=*
  """
}

serenity {
  take.screenshots = FOR_FAILURES
  restart.browser.each.scenario = false
  browser.maximized = false
}

headless.mode = true
